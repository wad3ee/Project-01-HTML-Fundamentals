<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
</head>
<body>
    <form>
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full-name" required minlength="2">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">

        <p>Experience Level</p>

        <label for="beginner">Beginner</label>
        <input type="radio" id="beginner" name="experience" value="beginner" required>

        <label for="intermediate">Intermediate</label>
        <input type="radio" id="intermediate" name="experience" value="intermediate">

        <label for="advanced">Advanced</label>
        <input type="radio" id="advanced" name="experience" value="advanced">

        <label for="agreement">
            I agree to the terms and conditions
        </label>
        <input type="checkbox" id="agreement" name="agreement" required>

        <label for="language">Favorite Language</label>
        <select id="language" name="language" required>
            <option value="">Choose a language</option>
            <option value="html">HTML</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="c">C</option>
        </select>

        <label for="message">Tell us about yourself</label>
        <textarea id="message" name="message" required minlength="10"></textarea>

        <button type="submit">Register</button>
    </form>
</body>
</html>
